name: Update UW Stories catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/update-uw-stories.mjs'
      - '.github/workflows/update-uw-stories.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild UW Stories catalogue
        run: node scripts/update-uw-stories.mjs

      - name: Commit catalogue if changed
        run: |
          if git diff --quiet -- data/uw-stories.json; then
            echo "UW Stories catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uw-stories.json
          git commit -m "Refresh UW Stories catalogue [skip ci]"
          git push
